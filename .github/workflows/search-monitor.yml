name: search-monitor
# 藏宝阁监控已迁移至腾讯云 CloudBase 云托管（国内 IP，更稳定）。
# 本 workflow 仅作定时闹钟：每 15 分钟唤醒云托管服务跑一轮监控（GET /run）。
# 监控逻辑、状态回写、扫码自愈全部在云端容器内完成（cloudrun/ 目录）。
on:
  schedule:
    - cron: '4,19,34,49 * * * *'
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger CloudBase monitor round
        run: |
          code=$(curl -s -m 90 -o /tmp/resp.txt -w "%{http_code}" \
            "https://mhxy-monitor-354273-11-1343329996.sh.run.tcloudbase.com/run")
          echo "HTTP $code, response: $(cat /tmp/resp.txt)"
          if [ "$code" != "200" ]; then
            echo "::warning::云托管 /run 触发返回 $code，服务可能未运行"
          fi
